version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=dokploy
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./src/main/resources/mybooks-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dokploy-network

  db:
    image: postgres:15.6-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=mybooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  postgres-data:


networks:
  dokploy-network:
    external: true